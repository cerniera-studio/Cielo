<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brolly</title>
<meta name="description" content="Live weather: now, the next hours and the week ahead.">
<meta name="theme-color" content="#0E1116">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column of tabs on a narrow screen; Today and Week side by side once unfolded (720px+). */
:root {
  color-scheme: dark;
  --ink: #0E1116;
  --surface: #171B22;
  --raised: #232A36;
  --line: #262C36;
  --text: #F2F4F7;
  --muted: #9AA3B2;
  --accent: #FFB547;
  --rain: #7FB4FF;
  --display: 'Bricolage Grotesque', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --body: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --gutter: 16px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--text);
  font-family: var(--body);
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: transparent; padding: 0; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

#app { height: 100%; display: flex; flex-direction: column; }

.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) var(--gutter) 0;
  width: 100%; max-width: 1080px; margin: 0 auto;
}
.place-btn { display: flex; align-items: center; gap: 8px; min-height: 48px; min-width: 0; font-size: 17px; font-weight: 600; }
.place-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.place-btn svg { flex: none; }
.top-actions { display: flex; align-items: center; gap: 8px; flex: none; }
.round-btn { width: 48px; height: 48px; border-radius: 24px; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; }
.round-btn.spin svg { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .round-btn.spin svg { animation: none; opacity: 0.5; } }
.units { display: flex; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 25px; }
.units button { width: 44px; height: 44px; border-radius: 22px; font-size: 14px; font-weight: 600; color: var(--muted); }
.units button[aria-pressed="true"] { background: var(--text); color: var(--ink); }

.banner { margin: 12px var(--gutter) 0; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; line-height: 1.4; }

main { flex: 1; min-height: 0; overflow-y: auto; padding: 20px var(--gutter) 24px; }
.panes { width: 100%; max-width: 480px; margin: 0 auto; }
.pane { display: none; flex-direction: column; min-width: 0; }
#app[data-tab="today"] #today, #app[data-tab="week"] #week, #app[data-tab="places"] #places { display: flex; }

.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }
.hero { display: flex; flex-direction: column; gap: 14px; }
.hero-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.hero-temp { font-family: var(--display); font-size: clamp(120px, 42vw, 176px); font-weight: 700; line-height: 0.86; letter-spacing: -0.05em; }
.hilo { display: flex; flex-direction: column; gap: 6px; padding-bottom: 12px; font-family: var(--mono); font-size: 14px; text-align: right; white-space: nowrap; }
.hilo span { color: var(--muted); }
.hero-line { font-size: 22px; font-weight: 500; letter-spacing: -0.01em; text-wrap: balance; }
.hero-sub { margin-top: 4px; font-size: 15px; color: var(--muted); }

.hours { margin-top: 24px; background: var(--surface); border-radius: 24px; padding: 16px 8px 12px; display: flex; flex-direction: column; gap: 8px; }
.hours-head { display: flex; justify-content: space-between; align-items: center; padding: 0 12px; font-size: 13px; color: var(--muted); }
.legend { display: flex; align-items: center; gap: 6px; }
.legend i { width: 6px; height: 10px; border-radius: 3px; background: var(--rain); display: block; }
.strip { position: relative; }
.cols { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.col { display: flex; flex-direction: column; align-items: center; padding: 8px 0; border-radius: 14px; }
.col[aria-pressed="true"] { background: var(--raised); }
.col .t { font-size: 14px; font-weight: 600; line-height: 20px; font-variant-numeric: tabular-nums; }
.col .gap { height: 64px; }
.col .barzone { display: flex; align-items: flex-end; height: 36px; }
.col .bar { width: 6px; border-radius: 3px; background: var(--rain); }
.col .h { margin-top: 8px; font-family: var(--mono); font-size: 11px; line-height: 16px; color: var(--muted); }
.col[aria-pressed="true"] .h { color: var(--text); }
.curve { position: absolute; left: 0; top: 32px; width: 100%; height: 56px; pointer-events: none; }
.curve svg { display: block; width: 100%; height: 56px; }
.dot { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 5px; background: var(--accent); box-shadow: 0 0 0 4px var(--raised); }

.metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 20px; }
.metric { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.metric .k { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; color: var(--muted); white-space: nowrap; }
.metric .v { font-family: var(--display); font-size: 22px; font-weight: 600; white-space: nowrap; }
.metric .v small { font-family: var(--body); font-size: 13px; font-weight: 500; color: var(--muted); }

.week-head { display: flex; flex-direction: column; gap: 12px; }
h1 { margin: 0; font-family: var(--display); font-size: 46px; font-weight: 700; line-height: 0.98; letter-spacing: -0.035em; }
h1 span { display: block; }
.sub { font-size: 15px; color: var(--muted); }
.days { display: flex; flex-direction: column; margin-top: 20px; }
.day { display: grid; grid-template-columns: 52px 24px 40px 34px minmax(0, 1fr) 34px; column-gap: 10px; align-items: center; min-height: 58px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.day .d { font-weight: 600; }
.day .p { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.day .p.wet { color: var(--rain); }
.day .lo { font-size: 15px; color: var(--muted); text-align: right; }
.day .hi { font-size: 15px; font-weight: 600; text-align: right; }
.track { position: relative; height: 6px; border-radius: 3px; background: var(--line); }
.track i { position: absolute; top: 0; height: 6px; border-radius: 3px; background: var(--accent); }
.ico-sun { color: var(--accent); } .ico-rain { color: var(--rain); } .ico-cloud, .ico-fog, .ico-snow, .ico-storm { color: var(--muted); }

.search { display: flex; align-items: center; gap: 10px; margin-top: 20px; padding: 0 6px 0 16px; height: 56px; border: 1px solid var(--line); border-radius: 16px; }
.search:focus-within { border-color: var(--muted); }
.search input { flex: 1; min-width: 0; height: 48px; border: 0; background: transparent; color: var(--text); font-family: var(--body); font-size: 16px; outline: none; }
.search input::placeholder { color: var(--muted); }
.search button { height: 44px; padding: 0 16px; border-radius: 12px; background: var(--text); color: var(--ink); font-size: 14px; font-weight: 600; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.note { margin-top: 12px; font-size: 14px; color: var(--muted); line-height: 1.4; }
.results { display: flex; flex-direction: column; margin-top: 8px; }
.result { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 0 4px; border-bottom: 1px solid var(--line); text-align: left; width: 100%; }
.result b { font-weight: 600; }
.result span { color: var(--muted); font-size: 14px; }
.result em { font-style: normal; font-size: 13px; font-weight: 600; color: var(--accent); flex: none; }
.saved { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
.place { display: flex; align-items: stretch; border-radius: 24px; background: var(--surface); }
.place.on { background: var(--accent); color: var(--ink); }
.place .pick { flex: 1; min-width: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 8px 16px 20px; text-align: left; border-radius: 24px; }
.place .meta { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.place .n { font-size: 20px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.place .s { font-size: 13px; font-weight: 500; color: var(--muted); }
.place.on .s { color: var(--ink); }
.place .pt { font-family: var(--display); font-size: 40px; font-weight: 700; line-height: 1; letter-spacing: -0.04em; }
.place .rm { width: 48px; flex: none; display: flex; align-items: center; justify-content: center; color: var(--muted); border-radius: 24px; }
.place.on .rm { color: var(--ink); }
.ghost { margin-top: 12px; min-height: 52px; width: 100%; border: 1px solid var(--line); border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600; }
.credit { margin-top: 24px; font-size: 13px; color: var(--muted); }
.credit a { color: var(--text); }

nav { border-top: 1px solid var(--line); background: var(--ink); padding: 8px var(--gutter) calc(env(safe-area-inset-bottom, 0px) + 10px); }
nav div { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); max-width: 480px; margin: 0 auto; }
nav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 52px; font-size: 12px; font-weight: 600; color: var(--muted); }
nav button[aria-pressed="true"] { color: var(--text); }
nav button[aria-pressed="true"] svg { color: var(--accent); }

@media (min-width: 720px) {
  :root { --gutter: 32px; }
  .panes { max-width: 1016px; }
  #app:not([data-tab="places"]) .panes { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 56px; align-items: start; }
  #app:not([data-tab="places"]) #today, #app:not([data-tab="places"]) #week { display: flex; }
  #app[data-tab="places"] .panes { max-width: 560px; }
  .hero-temp { font-size: 176px; }
  nav button[data-tab="week"] { display: none; }
  nav div { max-width: 320px; }
}
</style>
</head>
<body>
<div id="app" data-tab="today">
  <header class="top">
    <button class="place-btn" data-action="tab" data-tab="places" id="placeBtn" aria-label="Change place">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
      <span id="placeName">Loading</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AA3B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
    <div class="top-actions">
      <button class="round-btn" id="refresh" data-action="refresh" aria-label="Refresh forecast">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"></path><path d="M20 4v5h-5"></path></svg>
      </button>
      <div class="units" role="group" aria-label="Temperature unit">
        <button data-action="unit" data-unit="C" aria-pressed="true">°C</button>
        <button data-action="unit" data-unit="F" aria-pressed="false">°F</button>
      </div>
    </div>
  </header>
  <div class="banner" id="banner" role="status" hidden></div>
  <main>
    <div class="panes">
      <section class="pane" id="today" aria-label="Today"></section>
      <section class="pane" id="week" aria-label="Next 7 days"></section>
      <section class="pane" id="places" aria-label="Places">
        <h1>Places</h1>
        <form class="search" id="searchForm">
          <label class="sr" for="q">Add a place by city or postcode</label>
          <input id="q" type="search" placeholder="Add a city or postcode" autocomplete="off" enterkeyhint="search">
          <button type="submit">Search</button>
        </form>
        <div class="note" id="searchNote" hidden></div>
        <div class="results" id="results"></div>
        <div class="saved" id="saved"></div>
        <button class="ghost" data-action="locate" id="locate">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v4M12 18v4M2 12h4M18 12h4"></path></svg>
          <span>Use my location</span>
        </button>
        <div class="credit"><span id="updated"></span> <a href="https://open-meteo.com/" target="_blank" rel="noopener">Weather data by Open-Meteo.com</a></div>
      </section>
    </div>
  </main>
  <nav aria-label="Main">
    <div>
      <button data-action="tab" data-tab="today" aria-pressed="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"></path></svg>
        <span>Today</span>
      </button>
      <button data-action="tab" data-tab="week" aria-pressed="false">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>
        <span>Week</span>
      </button>
      <button data-action="tab" data-tab="places" aria-pressed="false">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
        <span>Places</span>
      </button>
    </div>
  </nav>
</div>

<script>
(function () {
'use strict';

var STORE = 'brolly.v1';
var STALE_MS = 10 * 60 * 1000;
var FORECAST = 'https://api.open-meteo.com/v1/forecast';
var GEOCODE = 'https://geocoding-api.open-meteo.com/v1/search';

var DEFAULT_PLACES = [
  { id: 'leeds', name: 'Leeds', region: 'England, United Kingdom', lat: 53.7997, lon: -1.5492 },
  { id: 'london', name: 'London', region: 'England, United Kingdom', lat: 51.5072, lon: -0.1276 },
  { id: 'lisbon', name: 'Lisbon', region: 'Portugal', lat: 38.7223, lon: -9.1393 },
  { id: 'tokyo', name: 'Tokyo', region: 'Japan', lat: 35.6762, lon: 139.6503 },
  { id: 'reykjavik', name: 'Reykjavík', region: 'Iceland', lat: 64.1466, lon: -21.9426 }
];

var state = { tab: 'today', unit: 'C', placeId: 'leeds', hour: 0, places: DEFAULT_PLACES.slice(), cache: {}, results: [], busy: false, failed: false };

// ---------- storage ----------
function load() {
  try {
    var raw = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (!raw) return;
    if (Array.isArray(raw.places) && raw.places.length) state.places = raw.places;
    if (raw.unit === 'F' || raw.unit === 'C') state.unit = raw.unit;
    if (raw.placeId) state.placeId = raw.placeId;
    if (raw.cache && typeof raw.cache === 'object') state.cache = raw.cache;
  } catch (e) { /* storage unavailable: run without it */ }
  if (!state.places.some(function (p) { return p.id === state.placeId; })) state.placeId = state.places[0].id;
}
function save() {
  try {
    localStorage.setItem(STORE, JSON.stringify({ places: state.places, unit: state.unit, placeId: state.placeId, cache: state.cache }));
  } catch (e) { /* ignore */ }
}

// ---------- helpers ----------
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function temp(c) { if (c == null || isNaN(c)) return '–'; return Math.round(state.unit === 'C' ? c : c * 9 / 5 + 32) + '°'; }
function place() { return state.places.filter(function (p) { return p.id === state.placeId; })[0] || state.places[0]; }
function entry(id) { return state.cache[id] || null; }
var SHORT = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
var FULL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
var MONTH = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function dow(iso) { return new Date(iso.slice(0, 10) + 'T12:00:00').getDay(); }
function dateLabel(iso) { return SHORT[dow(iso)] + ' ' + parseInt(iso.slice(8, 10), 10) + ' ' + MONTH[parseInt(iso.slice(5, 7), 10) - 1]; }
function clockIn(tz) {
  try { return new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date()); }
  catch (e) { return ''; }
}
function compass(deg) { return ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round(((deg % 360) + 360) % 360 / 45) % 8]; }

// WMO weather interpretation codes
function wmo(code, isDay) {
  var m = {
    0: ['Clear', 'sun'], 1: ['Mainly clear', 'sun'], 2: ['Partly cloudy', 'cloud'], 3: ['Overcast', 'cloud'],
    45: ['Fog', 'fog'], 48: ['Freezing fog', 'fog'],
    51: ['Light drizzle', 'rain'], 53: ['Drizzle', 'rain'], 55: ['Heavy drizzle', 'rain'], 56: ['Freezing drizzle', 'rain'], 57: ['Freezing drizzle', 'rain'],
    61: ['Light rain', 'rain'], 63: ['Rain', 'rain'], 65: ['Heavy rain', 'rain'], 66: ['Freezing rain', 'rain'], 67: ['Freezing rain', 'rain'],
    71: ['Light snow', 'snow'], 73: ['Snow', 'snow'], 75: ['Heavy snow', 'snow'], 77: ['Snow grains', 'snow'],
    80: ['Light showers', 'rain'], 81: ['Showers', 'rain'], 82: ['Heavy showers', 'rain'], 85: ['Snow showers', 'snow'], 86: ['Heavy snow showers', 'snow'],
    95: ['Thunderstorm', 'storm'], 96: ['Thunderstorm with hail', 'storm'], 99: ['Thunderstorm with hail', 'storm']
  }[code] || ['Unsettled', 'cloud'];
  var label = m[0];
  if (isDay === 0 && (code === 0 || code === 1)) label = 'Clear night';
  return { label: label, icon: m[1] };
}
var CLOUD = 'M7 18h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.1 11.2 3.5 3.5 0 0 0 7 18z';
var CLOUD_UP = 'M7 15h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.1 8.2 3.5 3.5 0 0 0 7 15z';
var ICONS = {
  sun: '<circle cx="12" cy="12" r="4"></circle><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"></path>',
  cloud: '<path d="' + CLOUD + '"></path>',
  rain: '<path d="' + CLOUD_UP + '"></path><path d="M8 18.5l-1 2.5M12 18.5l-1 2.5M16 18.5l-1 2.5"></path>',
  snow: '<path d="' + CLOUD_UP + '"></path><path d="M8 19.5h.01M12 19.5h.01M16 19.5h.01M10 22h.01M14 22h.01"></path>',
  fog: '<path d="M4 9h16M4 13h16M6 17h12"></path>',
  storm: '<path d="' + CLOUD_UP + '"></path><path d="M12.5 16l-2 3h3l-2 3"></path>'
};
function icon(kind, label) {
  return '<svg class="ico-' + kind + '" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="' + esc(label) + '">' + ICONS[kind] + '</svg>';
}

// ---------- data ----------
function forecastUrl(p) {
  return FORECAST + '?latitude=' + p.lat + '&longitude=' + p.lon +
    '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m,is_day' +
    '&hourly=temperature_2m,apparent_temperature,precipitation_probability,weather_code' +
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset' +
    '&wind_speed_unit=mph&timezone=auto&forecast_days=7';
}
function getJson(url) {
  var ctl = new AbortController();
  var timer = setTimeout(function () { ctl.abort(); }, 12000);
  return fetch(url, { signal: ctl.signal }).then(function (r) {
    clearTimeout(timer);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }, function (e) { clearTimeout(timer); throw e; });
}
function fetchPlace(p) {
  return getJson(forecastUrl(p)).then(function (j) {
    if (!j || !j.current || !j.hourly || !j.daily) throw new Error('Unexpected response');
    state.cache[p.id] = { at: Date.now(), j: j };
    return true;
  });
}
function refresh(force) {
  if (state.busy) return;
  var due = state.places.filter(function (p) {
    var e = entry(p.id);
    return force || !e || Date.now() - e.at > STALE_MS;
  });
  if (!due.length) { render(); return; }
  state.busy = true;
  $('refresh').classList.add('spin');
  Promise.all(due.map(function (p) { return fetchPlace(p).catch(function () { return false; }); })).then(function (oks) {
    state.busy = false;
    state.failed = oks.some(function (ok) { return !ok; });
    $('refresh').classList.remove('spin');
    // drop cache for places that no longer exist
    Object.keys(state.cache).forEach(function (id) { if (!state.places.some(function (p) { return p.id === id; })) delete state.cache[id]; });
    save();
    render();
  });
}

// Shape one place's response into what the screens need.
function model(p) {
  var e = entry(p.id);
  if (!e) return null;
  var j = e.j, cur = j.current, H = j.hourly, D = j.daily;
  var start = 0;
  for (var i = 0; i < H.time.length; i++) { if (H.time[i].slice(0, 13) === cur.time.slice(0, 13)) { start = i; break; } }
  var hours = [];
  for (var k = 0; k < 7 && start + k < H.time.length; k++) {
    var x = start + k;
    hours.push({
      iso: H.time[x], hh: H.time[x].slice(11, 13),
      t: k === 0 ? cur.temperature_2m : H.temperature_2m[x],
      feels: k === 0 ? cur.apparent_temperature : H.apparent_temperature[x],
      rain: H.precipitation_probability[x] == null ? 0 : H.precipitation_probability[x],
      code: k === 0 ? cur.weather_code : H.weather_code[x]
    });
  }
  var days = D.time.map(function (iso, n) {
    return { iso: iso, code: D.weather_code[n], hi: D.temperature_2m_max[n], lo: D.temperature_2m_min[n], rain: D.precipitation_probability_max[n] == null ? 0 : D.precipitation_probability_max[n] };
  });
  var sun;
  if (cur.time < D.sunrise[0]) sun = ['SUNRISE', D.sunrise[0]];
  else if (cur.time < D.sunset[0]) sun = ['SUNSET', D.sunset[0]];
  else sun = ['SUNRISE', D.sunrise[1] || D.sunrise[0]];
  return { at: e.at, tz: j.timezone, cur: cur, hours: hours, days: days, sun: sun, now: wmo(cur.weather_code, cur.is_day) };
}

function summary(m) {
  var label = m.now.label, hs = m.hours, k;
  if (hs[0].rain >= 50) {
    for (k = 1; k < hs.length; k++) if (hs[k].rain < 25) return label + ', easing by ' + hs[k].hh + ':00';
  } else if (hs[0].rain < 30) {
    for (k = 1; k < hs.length; k++) if (hs[k].rain >= 50) return label + ', rain likely from ' + hs[k].hh + ':00';
  }
  return label;
}
function headline(days) {
  var wet = [];
  days.forEach(function (d, i) { if (d.rain >= 50) wet.push(i); });
  var name = function (i, full) { return i === 0 ? 'today' : (full ? FULL : SHORT)[dow(days[i].iso)]; };
  var one;
  if (!wet.length) one = 'Dry all week.';
  else if (wet.length === days.length) one = 'Wet all week.';
  else if (wet.length === 1) one = 'Wet ' + name(wet[0]) + '.';
  else one = 'Rain on ' + wet.length + ' days.';
  var warm = 0;
  days.forEach(function (d, i) { if (d.hi > days[warm].hi) warm = i; });
  return [one, 'Warmest ' + name(warm) + '.'];
}

// ---------- render ----------
function renderToday(p, m) {
  var el = $('today');
  if (!m) { el.innerHTML = '<div class="eyebrow">' + esc(p.name) + '</div><p class="hero-line" style="margin-top:14px">' + (state.busy ? 'Fetching the forecast.' : 'No forecast yet. Check your connection and tap refresh.') + '</p>'; return; }
  if (state.hour >= m.hours.length) state.hour = 0;
  var h = m.hours[state.hour], atNow = state.hour === 0;
  var stamp = atNow ? dateLabel(m.cur.time) + ' · ' + clockIn(m.tz) : dateLabel(h.iso) + ' · ' + h.hh + ':00';
  var line = atNow ? summary(m) : wmo(h.code).label + ', ' + (h.rain > 0 ? h.rain + '% chance of rain at ' + h.hh + ':00' : 'dry at ' + h.hh + ':00');
  var ts = m.hours.map(function (x) { return x.t; });
  var lo = Math.min.apply(null, ts), hi = Math.max.apply(null, ts);
  var ys = ts.map(function (v) { return hi === lo ? 28 : 46 - ((v - lo) / (hi - lo)) * 36; });
  var n = m.hours.length, xs = ts.map(function (_, i) { return (i + 0.5) * (700 / n); });
  var d = 'M0 ' + ys[0] + ' L' + xs[0] + ' ' + ys[0];
  for (var i = 1; i < n; i++) { var mid = (xs[i - 1] + xs[i]) / 2; d += ' C' + mid + ' ' + ys[i - 1] + ' ' + mid + ' ' + ys[i] + ' ' + xs[i] + ' ' + ys[i]; }
  d += ' L700 ' + ys[n - 1];
  var cols = m.hours.map(function (x, i) {
    var bar = x.rain > 0 ? Math.max(3, Math.round(x.rain * 0.36)) : 0;
    var lab = i === 0 ? 'Now' : x.hh;
    return '<button class="col" data-action="hour" data-hour="' + i + '" aria-pressed="' + (i === state.hour) + '" aria-label="' + (i === 0 ? 'Now' : x.hh + ':00') + ', ' + temp(x.t) + ', rain chance ' + x.rain + '%">' +
      '<span class="t">' + temp(x.t) + '</span><span class="gap"></span><span class="barzone"><span class="bar" style="height:' + bar + 'px"></span></span><span class="h">' + lab + '</span></button>';
  }).join('');
  el.innerHTML =
    '<div class="hero">' +
      '<div class="eyebrow">' + esc(stamp) + '</div>' +
      '<div class="hero-row"><div class="hero-temp">' + temp(h.t) + '</div>' +
        '<div class="hilo"><div><span>HIGH</span> ' + temp(m.days[0].hi) + '</div><div><span>LOW</span> ' + temp(m.days[0].lo) + '</div></div></div>' +
      '<div><div class="hero-line">' + esc(line) + '</div><div class="hero-sub">Feels like ' + temp(h.feels) + '</div></div>' +
    '</div>' +
    '<div class="hours">' +
      '<div class="hours-head"><div>Tap an hour</div><div class="legend"><i></i><span>Rain chance</span></div></div>' +
      '<div class="strip"><div class="cols" style="grid-template-columns:repeat(' + n + ',minmax(0,1fr))">' + cols + '</div>' +
        '<div class="curve"><svg viewBox="0 0 700 56" preserveAspectRatio="none" fill="none" aria-hidden="true"><path d="' + d + '" stroke="#F2F4F7" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"></path></svg>' +
        '<span class="dot" style="left:' + (xs[state.hour] / 7) + '%;top:' + ys[state.hour] + 'px"></span></div></div>' +
    '</div>' +
    '<div class="metrics">' +
      '<div class="metric"><div class="k">RAIN</div><div class="v">' + h.rain + '%</div></div>' +
      '<div class="metric"><div class="k">WIND ' + compass(m.cur.wind_direction_10m) + '</div><div class="v">' + Math.round(m.cur.wind_speed_10m) + ' <small>mph</small></div></div>' +
      '<div class="metric"><div class="k">HUMIDITY</div><div class="v">' + Math.round(m.cur.relative_humidity_2m) + '%</div></div>' +
      '<div class="metric"><div class="k">' + m.sun[0] + '</div><div class="v">' + m.sun[1].slice(11, 16) + '</div></div>' +
    '</div>';
}

function renderWeek(p, m) {
  var el = $('week');
  if (!m) { el.innerHTML = ''; return; }
  var los = m.days.map(function (d) { return d.lo; }), his = m.days.map(function (d) { return d.hi; });
  var lo = Math.min.apply(null, los), hi = Math.max.apply(null, his), span = (hi - lo) || 1;
  var hl = headline(m.days);
  var rows = m.days.map(function (d, i) {
    var w = wmo(d.code);
    return '<div class="day"><div class="d">' + (i === 0 ? 'Today' : SHORT[dow(d.iso)]) + '</div>' + icon(w.icon, w.label) +
      '<div class="p' + (d.rain >= 20 ? ' wet' : '') + '">' + d.rain + '%</div><div class="lo">' + temp(d.lo) + '</div>' +
      '<div class="track"><i style="left:' + ((d.lo - lo) / span * 100) + '%;width:' + Math.max(4, (d.hi - d.lo) / span * 100) + '%"></i></div>' +
      '<div class="hi">' + temp(d.hi) + '</div></div>';
  }).join('');
  el.innerHTML = '<div class="week-head"><div class="eyebrow">Next 7 days</div><h1><span>' + hl[0] + '</span><span>' + hl[1] + '</span></h1>' +
    '<div class="sub">From ' + temp(lo) + ' at the coldest to ' + temp(hi) + ' at the warmest.</div></div><div class="days">' + rows + '</div>';
}

function renderPlaces() {
  var many = state.places.length > 1;
  $('saved').innerHTML = state.places.map(function (p) {
    var m = model(p), on = p.id === state.placeId;
    var sub = m ? m.now.label + ' · ' + clockIn(m.tz) : (p.region || 'No forecast yet');
    return '<div class="place' + (on ? ' on' : '') + '">' +
      '<button class="pick" data-action="pick" data-id="' + esc(p.id) + '" aria-pressed="' + on + '"><span class="meta"><span class="n">' + esc(p.name) + '</span><span class="s">' + esc(sub) + '</span></span><span class="pt">' + (m ? temp(m.cur.temperature_2m) : '') + '</span></button>' +
      (many ? '<button class="rm" data-action="remove" data-id="' + esc(p.id) + '" aria-label="Remove ' + esc(p.name) + '"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>' : '') +
      '</div>';
  }).join('');
  $('results').innerHTML = state.results.map(function (r, i) {
    return '<button class="result" data-action="add" data-index="' + i + '"><span><b>' + esc(r.name) + '</b> <span>' + esc(r.region) + '</span></span><em>Add</em></button>';
  }).join('');
}

function render() {
  var p = place(), m = model(p);
  $('app').dataset.tab = state.tab;
  $('placeName').textContent = p.name;
  $('placeBtn').setAttribute('aria-label', p.name + ', change place');
  Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (b) { b.setAttribute('aria-pressed', String(b.dataset.tab === state.tab)); });
  Array.prototype.forEach.call(document.querySelectorAll('.units button'), function (b) { b.setAttribute('aria-pressed', String(b.dataset.unit === state.unit)); });
  renderToday(p, m);
  renderWeek(p, m);
  renderPlaces();
  var banner = $('banner');
  if (state.failed && m) {
    var t = new Date(m.at);
    banner.textContent = 'Can’t reach the forecast service. Showing the forecast from ' + pad(t.getHours()) + ':' + pad(t.getMinutes()) + '.';
    banner.hidden = false;
  } else if (state.failed) {
    banner.textContent = 'Can’t reach the forecast service. Check your connection, then tap refresh.';
    banner.hidden = false;
  } else banner.hidden = true;
  if (m) { var u = new Date(m.at); $('updated').textContent = 'Updated ' + pad(u.getHours()) + ':' + pad(u.getMinutes()) + '.'; }
}

// ---------- actions ----------
function note(text) { var el = $('searchNote'); el.textContent = text || ''; el.hidden = !text; }
function addPlace(p) {
  var existing = state.places.filter(function (x) { return Math.abs(x.lat - p.lat) < 0.01 && Math.abs(x.lon - p.lon) < 0.01; })[0];
  if (existing) { state.placeId = existing.id; }
  else { state.places.push(p); state.placeId = p.id; }
  state.hour = 0; state.tab = 'today'; state.results = [];
  $('q').value = ''; note('');
  save(); render(); refresh(false);
}
document.addEventListener('click', function (ev) {
  var b = ev.target.closest('[data-action]');
  if (!b) return;
  var a = b.dataset.action;
  if (a === 'tab') { state.tab = b.dataset.tab; render(); }
  else if (a === 'unit') { state.unit = b.dataset.unit; save(); render(); }
  else if (a === 'hour') { state.hour = parseInt(b.dataset.hour, 10) || 0; render(); }
  else if (a === 'refresh') { refresh(true); }
  else if (a === 'pick') { state.placeId = b.dataset.id; state.hour = 0; state.tab = 'today'; save(); render(); }
  else if (a === 'remove') {
    if (state.places.length < 2) return;
    state.places = state.places.filter(function (p) { return p.id !== b.dataset.id; });
    delete state.cache[b.dataset.id];
    if (state.placeId === b.dataset.id) state.placeId = state.places[0].id;
    save(); render();
  }
  else if (a === 'add') {
    var r = state.results[parseInt(b.dataset.index, 10)];
    if (r) addPlace({ id: 'p' + Date.now(), name: r.name, region: r.region, lat: r.lat, lon: r.lon });
  }
  else if (a === 'locate') {
    if (!navigator.geolocation) { note('This browser can’t share a location. Search for the place instead.'); return; }
    note('Finding you.');
    navigator.geolocation.getCurrentPosition(function (pos) {
      addPlace({ id: 'here', name: 'My location', region: '', lat: +pos.coords.latitude.toFixed(4), lon: +pos.coords.longitude.toFixed(4) });
    }, function () { note('Location is blocked for this app. Allow it in your browser settings, or search for the place instead.'); }, { timeout: 10000, maximumAge: 600000 });
  }
});
$('searchForm').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var q = $('q').value.trim();
  if (q.length < 2) { note('Type at least two letters.'); return; }
  note('Searching.');
  getJson(GEOCODE + '?name=' + encodeURIComponent(q) + '&count=6&language=en').then(function (j) {
    state.results = (j.results || []).map(function (r) {
      return { name: r.name, region: [r.admin1, r.country].filter(Boolean).join(', '), lat: r.latitude, lon: r.longitude };
    });
    note(state.results.length ? '' : 'No place found for “' + q + '”. Try a nearby town or a different spelling.');
    renderPlaces();
  }).catch(function () { note('Search isn’t reachable right now. Check your connection and try again.'); });
});
document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(false); });
setInterval(function () { if (!document.hidden) refresh(false); }, 60 * 1000);

load();
render();
refresh(false);
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(function () { /* app still works without offline support */ });
}
})();
</script>
</body>
</html>
